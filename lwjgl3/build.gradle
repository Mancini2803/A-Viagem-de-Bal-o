plugins {
    id 'application'
}

dependencies {
    implementation project(':core')
    api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    api "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'com.escalada.lwjgl3.Lwjgl3Launcher'
}

// A pasta "assets" da raiz fica no classpath (sons opcionais acerto.wav / erro.wav).
sourceSets.main.resources.srcDirs += [rootProject.file('assets')]

tasks.named('run') {
    // Ao rodar pelo Gradle, o jogo usa "assets" como pasta de trabalho
    // (e o CSV de metricas e gravado em assets/metricas).
    workingDir = rootProject.file('assets')
    standardInput = System.in
    ignoreExitValue = true
    // No macOS o LWJGL3 exige esta opcao.
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs += '-XstartOnFirstThread'
    }
}

// Gera o executavel unico (jar com tudo dentro):  gradlew lwjgl3:dist
// Resultado: lwjgl3/build/libs/EscaladaEspacial.jar  ->  java -jar EscaladaEspacial.jar
tasks.register('dist', Jar) {
    archiveFileName = 'EscaladaEspacial.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    from sourceSets.main.output
    exclude 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}
